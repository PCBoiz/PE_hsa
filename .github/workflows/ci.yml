# CI cho bản migrate (Giai đoạn 6) — thứ project gốc chưa từng có.
# pytest backend + build/lint/tsc frontend trên mỗi push/PR.
name: CI

on:
  push:
  pull_request:

# CHỈ MỘT LƯỢT CI CHẠY TẠI MỘT THỜI ĐIỂM — và nhóm là TOÀN CỤC, không tách theo
# nhánh.
#
# Vì sao: job `backend` chạy pytest thẳng vào **Neon production** (xem env
# DATABASE_URL ở dưới), và tài nguyên phải giữ ấy là CSDL — nó chỉ có một, chung
# cho mọi nhánh. Tách nhóm theo `github.ref` sẽ vẫn cho hai nhánh cùng đập vào
# một CSDL.
#
# Cụ thể chỗ vỡ: fixture `temp_user` trong `backend/conftest.py` chèn một email
# CỐ ĐỊNH (`django_test_tmp@example.com`) vào `users`, mà `users.email` là
# `TEXT UNIQUE`. Hai lượt chồng nhau thì lượt sau CHẶN ở ràng buộc unique cho
# tới khi lượt trước rollback — nhân lên với mỗi test dùng fixture, trên một
# vòng dài ~16 phút. Đẩy ba commit liên tiếp (đúng nhịp của vòng lặp tự trị) là
# ba vòng như thế chồng lên production.
#
# `cancel-in-progress: true` được, vì CI KHÔNG phải cửa chặn deploy: Render tự
# triển khai khi `master` được gộp, không đợi CI. Nên thứ đáng giá ở đây là tín
# hiệu của commit MỚI NHẤT, không phải chạy cho xong lượt cũ.
#
# Đây là VÁ, không phải cách sửa đúng. Cách đúng là CI trỏ vào một nhánh Neon
# riêng thay vì CSDL thật.
#
# 05/09/2026: phần MÃ đã sẵn — job pytest đọc `DATABASE_URL_CI` trước, rơi về
# `DATABASE_URL` khi chưa có. Còn lại đúng một thao tác trên tài khoản Neon:
# tạo nhánh, rồi khai secret ấy. Khi đã khai, nhóm `concurrency` này vẫn nên
# giữ — hai lượt cùng ghi vào một nhánh vẫn đập nhau ở ràng buộc unique của
# `temp_user`.
concurrency:
  group: ci-neon-production
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django) — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django ruff
      # Lint TRƯỚC pytest: chạy dưới 1 giây và không chạm CSDL, trong khi một
      # vòng pytest ở đây mất ~16 phút VÀ đi tới Neon thật. Bắt lỗi rẻ trước.
      #
      # Bộ luật chọn theo thứ đã từng sai thật ở repo này — xem `pyproject.toml`.
      # Đáng giá nhất là `DTZ`: nó CƯỠNG CHẾ quy ước của `common/clock.py`
      # (giờ Việt Nam dạng naive vs `now()` UTC của SQL). Lệch 7 tiếng không làm
      # sập gì, nó chỉ đẩy buổi học tối thứ Sáu sang thống kê thứ Bảy — loại lỗi
      # chỉ bị phát hiện khi có người ngồi đếm tay.
      - name: Lint backend (ruff)
        working-directory: backend
        run: python -m ruff check .
      # NÓI RA CI ĐANG NỐI VÀO ĐÂU (05/09/2026).
      #
      # Trước bước này, câu trả lời cho "lượt CI vừa rồi có đập vào CSDL học
      # viên thật không" phải đi đọc cấu hình secret — tức không ai đọc. Một
      # dòng máy chủ trong log là đủ để thấy ngay, và nó không lộ mật khẩu:
      # chỉ in phần host, cắt trước dấu `?`.
      - name: Nói rõ CSDL đang dùng
        env:
          DB_CI: ${{ secrets.DATABASE_URL_CI }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DB_CI" ]; then
            echo "::notice::CI dùng NHÁNH RIÊNG (DATABASE_URL_CI)."
            echo "$DB_CI" | sed -E 's#^[^@]*@#…@#; s#\?.*##'
          else
            echo "::warning::CI đang chạy trên CSDL của secret DATABASE_URL."
            echo "::warning::Nếu đó là Neon production thì pytest đang ghi lên dữ liệu học viên THẬT mỗi lần push."
            echo "::warning::Cách bịt: tạo một nhánh Neon rồi khai secret DATABASE_URL_CI — job này tự chuyển, không phải sửa mã."
            echo "$DB" | sed -E 's#^[^@]*@#…@#; s#\?.*##'
          fi

      - name: Run pytest
        working-directory: backend
        env:
          # ƯU TIÊN NHÁNH RIÊNG. `DATABASE_URL_CI` có thì dùng nó; không thì rơi
          # về `DATABASE_URL` như trước.
          #
          # Viết theo hướng này để việc chuyển sang nhánh Neon là MỘT thao tác
          # cấu hình, không phải một lượt sửa mã: khai secret xong là lượt CI kế
          # tiếp đã thôi đụng vào dữ liệu học viên thật.
          #
          # Vì sao không đơn giản đổi thẳng `DATABASE_URL` sang nhánh: cùng một
          # tên secret cho hai nghĩa khác nhau là cách chắc chắn để một hôm nào
          # đó ai đó trỏ nhầm nó về production và không ai nhận ra.
          #
          # Bộ test vẫn cuộn lại ở cuối mỗi test (xem `backend/conftest.py`),
          # nhưng "cuộn lại" không phải "không đụng": nó vẫn chiếm kết nối, vẫn
          # giữ khoá, và một test viết ngoài giao dịch thì cuộn lại không cứu.
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI || secrets.DATABASE_URL }}
          SECRET_KEY: ci-only-secret-key
        run: python -m pytest -q

  frontend:
    name: Frontend (Next.js) — lint + tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack pnpm
        run: corepack enable
      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # 15 file JS thuần trong public/static KHÔNG đi qua bundler, nên `next
      # build` không hề đọc chúng — một lỗi cú pháp ở đó lọt thẳng lên
      # production và giết cả trang (đã xảy ra 27/08/2026 với admin.inline.js:
      # cả màn Quản trị chết, không ai tạo được lớp hay cấp tài khoản).
      - name: Kiểm cú pháp JS thuần
        working-directory: frontend
        run: |
          for f in public/static/js/*.js public/static/js/pages/*.js; do
            node --check "$f" || exit 1
          done

      # `manage.py check` KHÔNG nạp mô-đun lệnh quản trị (chúng chỉ được nạp khi
      # ai đó gọi lệnh), nên một lỗi cú pháp trong `common/management/commands/`
      # đi thẳng lên production mà mọi cửa kiểm đều xanh. Đã xảy ra thật ngày
      # 30/08/2026: một dòng import hỏng nằm im qua `manage.py check`.
      # Cùng loại lỗ với 15 tệp JS thuần không đi qua bundler ở bước trên.
      - name: Kiểm cú pháp toàn bộ Python
        working-directory: backend
        run: python -m compileall -q accounts common teaching stats courses lessons quizzes notifications roadmap leaderboard achievements forum courseadmin mockexam chatbot config

      # `pnpm lint` chứ KHÔNG `eslint src`: hai câu ấy quét hai phạm vi khác
      # nhau. `src` bỏ qua 15 tệp JS thuần trong `public/static/js` — đúng chỗ
      # đã một lần giết cả màn Quản trị trên production. Nay CI và máy của người
      # viết chạy CÙNG một câu, với `--max-warnings 0`.
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # Unit test Node thuần trong `e2e/unit/`. Trước 01/09/2026 CI KHÔNG chạy
      # chúng: `forum-xss.test.mjs` được viết ra để giữ một lỗ stored-XSS đã vá
      # (tên tác giả bài viết nối thô vào innerHTML) và suốt thời gian đó không
      # ai chạy nó lần nào — một phép kiểm hồi quy không chạy là một phép kiểm
      # không tồn tại, chỉ tệ hơn ở chỗ nó làm người ta yên tâm.
      #
      # Vòng lặp chứ không liệt kê từng tệp: thêm một bộ kiểm mới thì nó tự vào
      # CI, không phải nhớ sửa thêm chỗ này.
      - name: Unit test (Node thuần)
        working-directory: frontend
        run: |
          for f in e2e/unit/*.test.mjs; do
            echo "── $f"
            node "$f" || exit 1
          done
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9000
        run: pnpm build
