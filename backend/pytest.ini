[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# `tests_*.py` THÊM 04/09/2026. Thiếu nó thì `common/tests_hop_dong.py` — 6 phép
# kiểm hợp đồng hình dạng JSON — KHÔNG được gom, và CI chạy `pytest -q` nên
# chúng chưa từng chạy ở đó lần nào. `RULES §4` liệt nó là một cửa bắt buộc,
# nhưng liệt bằng ĐƯỜNG DẪN (`pytest common/tests_hop_dong.py`), tức chỉ chạy
# khi có người gõ tay.
#
# Thứ chúng canh là đúng lỗi đã đẻ ra `RULES §1`: 45/45 phép kiểm xanh trong khi
# cả màn điểm danh chết, vì backend trả `class`/`startsAt` còn frontend đọc
# `klass`/`starts_at`. Một phép kiểm hồi quy không chạy là một phép kiểm không
# tồn tại — chỉ tệ hơn ở chỗ nó làm người ta yên tâm.
python_files = tests.py test_*.py tests_*.py
# Bộ test chạy trên DB thật (rollback cuối test) — xem conftest.py
addopts = -p no:cacheprovider

# CANH GIỜ MỖI PHÉP KIỂM (thêm 17/09/2026, cần gói `pytest-timeout`).
#
# Lượt toàn bộ ngày 16/09 TREO VĨNH VIỄN: một phép kiểm INSERT email trùng với
# dòng mà một giao dịch mồ côi trên Neon còn giữ, và đứng chờ khoá chỉ mục duy
# nhất mãi mãi — Postgres không thấy bế tắc vì bên giữ khoá không chờ ai. Không
# đỏ, không hết giờ, không in gì: 35 phút sau mới có người nhận ra. Trên GitHub
# Actions cùng cảnh ấy đốt tới trần mặc định 6 GIỜ của một job.
#
# Vá 17/09 ở `temp_user` chỉ bịt MỘT email; còn hàng chục chỗ INSERT email cố
# định trong các tệp kiểm. Thay vì đi bịt từng chỗ, chặn ở tầng khung: phép kiểm
# nào chạy quá `timeout` giây thì bộ chạy tự in ngăn xếp của mọi luồng (chỉ đúng
# câu lệnh đang chờ) rồi DỪNG CẢ TIẾN TRÌNH với mã khác 0.
#
# `thread` chứ không `signal`: Windows không có SIGALRM, và kể cả trên Linux,
# `signal` không cắt được một lời gọi đang kẹt trong mã C của psycopg — đúng chỗ
# treo thật. `thread` dùng `os._exit`, nên phần còn lại của lượt KHÔNG chạy;
# đổi "treo không biết tới bao giờ" lấy "dừng kèm chỗ treo" là đáng.
#
# Con số 600: đo 18/09 (`--durations=25`, lượt 792/792, 46 phút 11): phép kiểm
# chậm nhất 60,85 s (`tests_ma_tran_quyen::test_moi_view_co_hang_rao_chan_dung_sau_vai`),
# phần dựng fixture lâu nhất 57,54 s. `pytest-timeout` tính CẢ dựng + chạy + dọn, nên
# 600 s rộng gần 10 lần — một Neon chậm không làm đỏ oan — mà treo thật thì 10 phút
# là dừng. Thêm phép kiểm nặng hơn nhiều thì đo lại, đừng nâng số theo cảm giác.
timeout = 600
timeout_method = thread
# BẮT BUỘC có gói, không chỉ mong có. Đo 17/09: thiếu `pytest-timeout` thì hai
# khoá trên chỉ sinh "PytestConfigWarning: Unknown config option" giữa đống cảnh
# báo khác, và canh giờ lặng lẽ KHÔNG chạy. Khai ở đây thì thiếu gói là lỗi ngay
# từ dòng đầu, kèm tên gói cần cài.
required_plugins = pytest-django pytest-timeout
